<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- CSP は index.html と同じ（docs/02_architecture.md §3「CSP」） -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'nonce-xsheet-example'; img-src blob:; connect-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>XSheet の例（2 つの表を一緒にスクロール）</title>
    <link rel="stylesheet" href="/src/style.css" nonce="xsheet-example" />
    <link rel="stylesheet" href="./example.css" nonce="xsheet-example" />
    <style nonce="xsheet-example">
      .ex-pair {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
        gap: 12px;
      }
      .ex-pane {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        gap: 6px;
      }
      .ex-pane-body {
        flex: 1 1 auto;
        min-height: 0;
      }
    </style>
    <script type="module" src="./scroll-sync.ts"></script>
  </head>
  <body>
    <!--
      確認用：scrollElement（ADR-0010 §1・M7-19）で 2 つの表を一緒に動かす。
      InterX-Viewer の scroll と同じく縦の割合（scrollTop ÷ (scrollHeight − clientHeight)）で合わせ、
      自分が動かした位置（1px 以内）の scroll は相手へ送り返さない。
    -->
    <header class="ex-bar">
      <h1 class="ex-title">XSheet scrollElement</h1>
      <label class="ex-field">
        <span>合わせ方</span>
        <select id="mode">
          <option value="y" selected>縦の割合</option>
          <option value="xy">縦と横の割合</option>
          <option value="off">合わせない</option>
        </select>
      </label>
      <output id="status" class="ex-status" aria-live="polite"></output>
    </header>
    <main class="ex-viewer ex-pair">
      <section class="ex-pane">
        <label class="ex-field">
          <span>左</span>
          <select id="sample-left"></select>
          <input id="file-left" type="file" accept=".xlsx" />
        </label>
        <div id="left" class="ex-pane-body"></div>
      </section>
      <section class="ex-pane">
        <label class="ex-field">
          <span>右</span>
          <select id="sample-right"></select>
          <input id="file-right" type="file" accept=".xlsx" />
        </label>
        <div id="right" class="ex-pane-body"></div>
      </section>
    </main>
  </body>
</html>
