<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- CSP は index.html と同じ（docs/02_architecture.md §3「CSP」） -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'nonce-xsheet-example'; img-src blob:; connect-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>XSheet の例（印刷）</title>
    <link rel="stylesheet" href="/src/style.css" nonce="xsheet-example" />
    <link rel="stylesheet" href="./example.css" nonce="xsheet-example" />
    <style nonce="xsheet-example">
      /* 印刷の描画（renderForPrint）を置く所。画面では「プレビュー」のときだけ出す */
      #print-host {
        display: none;
      }

      @media screen {
        body.ex-preview .ex-viewer {
          display: none;
        }

        body.ex-preview #print-host {
          display: block;
          flex: 1 1 auto;
          min-height: 0;
          overflow: auto;
          padding: 16px;
          background: #9ca3af;
        }

        body.ex-preview .xs-print-page {
          margin: 0 auto 16px;
          box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
          /* 用紙の余白の代わり（印刷では @page の余白） */
          outline: 48px solid #ffffff;
          margin-bottom: 112px;
        }
      }

      /* 印刷では印刷の描画だけを出す。用紙の大きさ・余白は @page（A4 の縦は下の既定、横は print.ts が足す） */
      @media print {
        html,
        body {
          display: block;
          height: auto;
          background: #ffffff;
        }

        body > :not(#print-host) {
          display: none !important;
        }

        #print-host {
          display: block !important;
        }
      }

      @page {
        size: A4 portrait;
        margin: 0.75in 0.7in;
      }
    </style>
    <script type="module" src="./print.ts"></script>
  </head>
  <body>
    <!--
      確認用：renderForPrint（ADR-0010 §2・M7-20）。表示中のシートをページに分けて描き、ブラウザの印刷のプレビューで
      抜けが無いことを見る。「プレビュー」は同じ描画を画面に出す（ページの間の白い縁は画面だけの飾り）。
    -->
    <header class="ex-bar">
      <h1 class="ex-title">XSheet renderForPrint</h1>
      <label class="ex-field">
        <span>サンプル</span>
        <select id="sample"></select>
        <input id="file" type="file" accept=".xlsx" />
      </label>
      <label class="ex-field">
        <span>用紙</span>
        <select id="paper">
          <option value="portrait" selected>A4 縦</option>
          <option value="landscape">A4 横</option>
        </select>
      </label>
      <label class="ex-field ex-check">
        <input id="fit" type="checkbox" />
        <span>幅に合わせる</span>
      </label>
      <label class="ex-field ex-check">
        <input id="headers" type="checkbox" />
        <span>見出し</span>
      </label>
      <label class="ex-field ex-check">
        <input id="gridlines" type="checkbox" />
        <span>目盛り線</span>
      </label>
      <label class="ex-field">
        <span>画面のテーマ</span>
        <select id="theme">
          <option value="light" selected>ライト</option>
          <option value="dark">ダーク</option>
        </select>
      </label>
      <button id="preview" type="button">プレビュー</button>
      <button id="print" type="button">印刷</button>
      <output id="status" class="ex-status" aria-live="polite"></output>
    </header>
    <main id="viewer" class="ex-viewer"></main>
    <div id="print-host"></div>
  </body>
</html>
