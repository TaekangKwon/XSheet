<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      XSheet の表示に要る CSP（docs/01_requirements.md N7）：
      - script-src 'self'：ライブラリと形の表（動的 import）を同じ出所から読む
      - style-src：書式の <style> 要素に 'unsafe-inline' か nonce が要る
      - img-src blob:：画像は blob URL で出す
      connect-src 'self' は、この例でサンプルの .xlsx を fetch するためと、Vite の開発サーバーの更新の通知のため。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src blob:; connect-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>XSheet の例</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="./example.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <header class="ex-bar">
      <h1 class="ex-title">XSheet</h1>
      <label class="ex-field">
        <span>ファイル</span>
        <input
          id="file"
          type="file"
          accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        />
      </label>
      <label class="ex-field">
        <span>サンプル</span>
        <select id="sample">
          <option value="">（選ぶ）</option>
        </select>
      </label>
      <label class="ex-field">
        <span>テーマ</span>
        <select id="theme">
          <option value="system">OS に合わせる</option>
          <option value="light">明るい</option>
          <option value="dark">ダーク</option>
        </select>
      </label>
      <label class="ex-field">
        <span>文言</span>
        <select id="lang">
          <option value="ja">日本語</option>
          <option value="en">English</option>
        </select>
      </label>
      <label class="ex-field ex-check">
        <input id="drawings" type="checkbox" checked />
        <span>図を出す</span>
      </label>
      <output id="status" class="ex-status" aria-live="polite"></output>
    </header>
    <main id="viewer" class="ex-viewer">
      <p class="ex-hint">.xlsx を選ぶか、ここへドロップしてください。</p>
    </main>
  </body>
</html>
