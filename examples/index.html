<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      XSheet の表示に要る CSP（docs/02_architecture.md §3「CSP」）：
      - script-src 'self'：ライブラリと形の表（動的 import）を同じ出所から読む
      - style-src 'nonce-…'：style.css の <link> と、書式の <style> 要素（renderWorkbook の nonce で付く）だけを許す
      - img-src blob:：画像は blob URL で出す
      connect-src 'self' は、この例でサンプルの .xlsx を fetch するためと、Vite の開発サーバーの更新の通知のため。
      nonce は本来、応答ごとにサーバーが作る推測できない値にする。この例は固定の値。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'nonce-xsheet-example'; img-src blob:; connect-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>XSheet の例</title>
    <link rel="stylesheet" href="/src/style.css" nonce="xsheet-example" />
    <link rel="stylesheet" href="./example.css" nonce="xsheet-example" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <header class="ex-bar">
      <h1 class="ex-title">XSheet</h1>
      <label class="ex-field">
        <span>ファイル</span>
        <input
          id="file"
          type="file"
          accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        />
      </label>
      <label class="ex-field">
        <span>サンプル</span>
        <select id="sample">
          <option value="">（選ぶ）</option>
        </select>
      </label>
      <label class="ex-field">
        <span>テーマ</span>
        <select id="theme">
          <option value="system">OS に合わせる</option>
          <option value="light">明るい</option>
          <option value="dark">ダーク</option>
        </select>
      </label>
      <label class="ex-field">
        <span>文言</span>
        <select id="lang">
          <option value="ja">日本語</option>
          <option value="en">English</option>
        </select>
      </label>
      <label class="ex-field">
        <span>タブ</span>
        <select id="tab-position">
          <option value="top">上</option>
          <option value="bottom">下</option>
        </select>
      </label>
      <label class="ex-field ex-check">
        <input id="drawings" type="checkbox" checked />
        <span>図を出す</span>
      </label>
      <label class="ex-field ex-check">
        <input id="builtin-era" type="checkbox" />
        <span>組み込みの和暦</span>
      </label>
      <label class="ex-field ex-check">
        <input id="headers" type="checkbox" checked />
        <span>見出し</span>
      </label>
      <label class="ex-field">
        <span>倍率</span>
        <select id="zoom">
          <option value="fit">幅に合わせる</option>
          <option value="0.5">50%</option>
          <option value="0.75">75%</option>
          <option value="1" selected>100%</option>
          <option value="1.25">125%</option>
          <option value="1.5">150%</option>
          <option value="2">200%</option>
        </select>
      </label>
      <form id="find" class="ex-field ex-find" role="search">
        <input
          id="find-text"
          type="search"
          placeholder="表示中のシートを検索"
          aria-label="検索する文字"
        />
        <button id="find-prev" type="button" aria-label="前のヒット" disabled>◀</button>
        <button id="find-next" type="submit" aria-label="次のヒット">▶</button>
        <output id="find-count" aria-live="polite"></output>
      </form>
      <output id="status" class="ex-status" aria-live="polite"></output>
    </header>
    <main id="viewer" class="ex-viewer">
      <p class="ex-hint">.xlsx を選ぶか、ここへドロップしてください。</p>
    </main>
  </body>
</html>
