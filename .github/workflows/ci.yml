# CI（ADR-0004）：main への push と PR で、手元と同じ検査を回す。
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Size
        run: npm run size

      - name: Consumer check
        run: npm run check:consumer

      - name: Standalone check
        run: npm run check:standalone

      - name: Pages build
        run: npm run pages:build
